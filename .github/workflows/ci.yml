name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - name: test
        run: npm test
      - name: build the UI
        run: npm run build

  rust:
    name: rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Rust side embeds the built frontend at compile time, so it has to
      # exist before cargo is asked to look at it.
      - run: npm run build
      - name: check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
