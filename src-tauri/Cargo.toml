[package]
name = "third-street-bookmarks"
version = "1.2.0"
description = "Third Street Bookmarks — a local-first X bookmark reader"
authors = ["Mayank Sagar"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tsb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# NSVisualEffectView behind the webview — the real macOS material, not a CSS
# approximation of one.
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parsing external links before opening them, so scheme validation is a real
# parse rather than a string prefix check.
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
