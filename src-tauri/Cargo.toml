[package]
name = "third-street-bookmarks"
version = "1.2.0"
description = "Third Street Bookmarks — a local-first X bookmark reader"
authors = ["Mayank Sagar"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tsb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
