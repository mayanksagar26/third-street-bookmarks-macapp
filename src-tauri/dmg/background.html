<!--
  Source for the disk image background.

  Ivory sheet, a serif line that says what to do, and one hand-drawn arrow
  across the gap. The instruction is the artwork; there is nothing else on the
  sheet, because a disk image window is read once and then never again.

  Two things to know if you edit this.

  Finder owns the icon labels and draws them near-black whatever the Mac's
  appearance — the bundler can set their size and nothing else. That was a real
  problem on the old night-coloured sheet, where the labels sat dark on dark and
  were close to invisible. On ivory they land the right way round, so the labels
  are legible for the first time.

  Geometry is load-bearing. Icons sit at 162,304 and 490,304 per
  tauri.conf.json and span y=240..368 at ICON_SIZE 128, so nothing else may
  occupy that band. The arrow threads the gap between them and stops short of
  both.

  Regenerate with: src-tauri/dmg/render.sh
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Bundled with the app, so this renders identically offline. The italic is a
     real cut rather than a synthesised slant: Playfair is high-contrast, and a
     sheared roman shows it badly at this size. */
  @font-face {
    font-family: 'Playfair Display';
    font-style: normal;
    font-weight: 500 700;
    src: url('../../public/fonts/playfair-display-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Playfair Display';
    font-style: italic;
    font-weight: 500 700;
    src: url('../../public/fonts/playfair-display-latin-italic.woff2') format('woff2');
  }

  html, body { background: #fffded; }

  .dmg {
    position: relative;
    width: 660px;
    height: 488px;
    overflow: hidden;
    background: #fffded;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .headline {
    position: absolute;
    top: 62px;
    left: 54px;
    right: 54px;
    text-align: center;
    font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
    font-size: 43px;
    font-weight: 500;
    line-height: 1.24;
    letter-spacing: -0.2px;
    color: #000;
  }

  /* One word carries the whole instruction, so it gets the italic. */
  .headline em { font-style: italic; font-weight: 500; }

  /* Hand-drawn rather than geometric: a ruled line next to a serif this warm
     reads as a diagram, and the sheet is not a diagram. */
  .arrow {
    position: absolute;
    left: 282px;
    top: 281px;
    width: 96px;
    height: 46px;
  }
</style>

<div class="dmg">
  <div class="headline">To install, <em>drag</em> Third&nbsp;Street<br>to Applications</div>

  <svg class="arrow" viewBox="0 0 96 46" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- One stroke: a shallow dip, a loop that crosses its own tail, then away
         to the upper right. Drawn flat and wide — a tall arc next to a serif
         this large reads as a swoosh rather than a gesture. -->
    <path
      d="M3 6 C 6 26, 22 38, 40 34 C 52 31, 54 18, 46 16 C 38 14, 34 26, 46 32 C 60 39, 76 32, 88 16"
      stroke="#f2a852" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrowhead as its own two strokes, so it keeps the same hand as the sweep. -->
    <path
      d="M76 10 L90 13 L87 27"
      stroke="#f2a852" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
