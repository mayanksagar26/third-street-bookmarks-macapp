<!--
  Source for the disk image background.

  ── The constraint ──────────────────────────────────────────────────────────
  Finder owns the icon labels. It draws "Third Street Bookmarks" and
  "Applications" in near-black in a DMG window whatever the Mac's appearance,
  and exposes no way to recolour them — the bundler can set their size and
  nothing else. So white label text is not available at any price, and a sheet
  that is dark all the way down loses both names.

  ── The design ──────────────────────────────────────────────────────────────
  Two planes and a horizon, and nothing written on either. Night above. A lit
  floor below, starting exactly at y=179 where the 128px icons end, so the
  icons stand on it and their black labels land on light.

  There is no wordmark and no instruction line. The app icon says whose it is,
  the folder says where it goes, the arrow says what to do. Anything else
  would be a caption on a sentence that is already complete.

  Geometry is load-bearing. Icons sit at 180,115 and 480,115 per
  tauri.conf.json, span y=51..179 at ICON_SIZE 128, and Finder writes each
  label just beneath at TEXT_SIZE 16.

  Regenerate with: src-tauri/dmg/render.sh
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: #000; }

  .dmg {
    position: relative;
    width: 660px;
    height: 260px;
    overflow: hidden;
    /* The app's own night gradient, sampled from the icon. */
    background:
      radial-gradient(560px 260px at 10% -30%, rgba(90, 170, 235, 0.15), transparent 62%),
      radial-gradient(480px 230px at 104% -6%, rgba(255, 255, 255, 0.045), transparent 58%),
      linear-gradient(168deg, #1c2632 0%, #131821 58%, #0c0d12 100%);
  }

  /* The rim the app window carries, so the two read as one object. */
  .dmg::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.13),
      inset 0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  /* The lit floor. Its top edge is the icon baseline, which is why the icons
     look placed rather than floating. */
  .floor {
    position: absolute;
    left: 0;
    right: 0;
    top: 179px;
    bottom: 0;
    background: linear-gradient(180deg, #f6f7f9 0%, #e9ebf0 100%);
  }

  /* A hair of light along the edge, the way a surface catches it. */
  .floor::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -1px;
    height: 1px;
    background: rgba(255, 255, 255, 0.22);
  }

  /* Contact shadows. Small and faint — enough that the icons have weight,
     not so much that they read as a graphic. */
  .shadow {
    position: absolute;
    top: 181px;
    height: 12px;
    margin-top: -6px;
    pointer-events: none;
    background: radial-gradient(
      closest-side ellipse at 50% 50%,
      rgba(12, 16, 24, 0.2) 0%,
      rgba(12, 16, 24, 0.08) 55%,
      rgba(12, 16, 24, 0) 100%
    );
  }
  .shadow.app  { left: 180px; width: 132px; margin-left: -66px; }
  .shadow.apps { left: 480px; width: 124px; margin-left: -62px; }

  /* One thin arrow across the gap, in the night half. */
  .arrow {
    position: absolute;
    top: 112px;
    left: 268px;
    width: 124px;
    height: 1px;
    background: linear-gradient(
      to right,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.22) 26%,
      rgba(255, 255, 255, 0.5) 100%
    );
  }
  .arrow::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    width: 8px;
    height: 8px;
    margin: -4.5px -1px 0 0;
    border-right: 1px solid rgba(255, 255, 255, 0.5);
    border-top: 1px solid rgba(255, 255, 255, 0.5);
    transform: rotate(45deg);
  }
</style>

<div class="dmg">
  <div class="arrow"></div>

  <div class="floor"></div>
  <div class="shadow app"></div>
  <div class="shadow apps"></div>
</div>
