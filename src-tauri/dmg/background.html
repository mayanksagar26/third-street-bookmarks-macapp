<!--
  Source for the disk image background.

  Night the whole way down: the app's own gradient, the mark in white, one
  line of instruction, one thin arrow across the gap.

  One thing to know if you edit this. Finder owns the two icon labels and
  draws them near-black whatever the Mac's appearance — the bundler can set
  their size and nothing else, so there is no way to make them white. On this
  sheet they sit dark on dark and are close to invisible. That is a deliberate
  trade: the sheet is the app's colour, and the icons carry the meaning.

  Geometry is load-bearing. Icons sit at 180,175 and 480,175 per
  tauri.conf.json and span y=111..239 at ICON_SIZE 128, so nothing else may
  occupy that band.

  Regenerate with: src-tauri/dmg/render.sh
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Bundled with the app, so this renders identically offline. */
  @font-face {
    font-family: 'Playfair Display';
    font-style: normal;
    font-weight: 600 700;
    src: url('../../public/fonts/playfair-display-latin.woff2') format('woff2');
  }

  html, body { background: #000; }

  .dmg {
    position: relative;
    width: 660px;
    height: 340px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    /* The app's own night gradient, sampled from the icon. */
    background:
      radial-gradient(620px 320px at 10% -22%, rgba(90, 170, 235, 0.15), transparent 62%),
      radial-gradient(520px 280px at 104% 4%, rgba(255, 255, 255, 0.045), transparent 58%),
      linear-gradient(168deg, #1c2632 0%, #131821 46%, #0c0d12 100%);
  }

  /* The rim the app window carries, so the two read as one object. */
  .dmg::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.13),
      inset 0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  .mark {
    position: absolute;
    top: 46px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 3px;
    /* Optical: letter-spacing pads the right side of the last glyph. */
    text-indent: 3px;
    color: #ffffff;
  }

  .sub {
    position: absolute;
    top: 101px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12.5px;
    letter-spacing: 0.2px;
    color: rgba(255, 255, 255, 0.4);
  }

  /* One thin arrow across the gap between the icons. */
  .arrow {
    position: absolute;
    top: 172px;
    left: 268px;
    width: 124px;
    height: 1px;
    background: linear-gradient(
      to right,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.22) 26%,
      rgba(255, 255, 255, 0.5) 100%
    );
  }
  .arrow::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    width: 8px;
    height: 8px;
    margin: -4.5px -1px 0 0;
    border-right: 1px solid rgba(255, 255, 255, 0.5);
    border-top: 1px solid rgba(255, 255, 255, 0.5);
    transform: rotate(45deg);
  }
</style>

<div class="dmg">
  <div class="mark">TSB</div>
  <div class="sub">Drag the app into your Applications folder</div>
  <div class="arrow"></div>
</div>
