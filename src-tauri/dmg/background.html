<!--
  Source for the disk image background.

  It is light on purpose, and this is not a style preference. Finder draws icon
  labels in near-black in a DMG window whether the Mac is in Light or Dark
  Mode, and offers no way to change that. Against the dark sheet this started
  as, "Third Street Bookmarks" and "Applications" came out black on black —
  effectively invisible. Anything readable has to be light.

  So the sheet stays quiet and gets out of the way: a serif wordmark, one line
  of instruction, one thin arrow. The icons and their labels are the content.

  Geometry is load-bearing. The icons land at the positions declared in
  tauri.conf.json (180,175 and 480,175 in a 660x340 sheet) and Finder writes
  the label directly beneath each, so the band from y=210 down stays empty.

  Regenerate with: src-tauri/dmg/render.sh
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Bundled with the app, so this renders identically offline. */
  @font-face {
    font-family: 'Playfair Display';
    font-style: normal;
    font-weight: 600 700;
    src: url('../../public/fonts/playfair-display-latin.woff2') format('woff2');
  }

  html, body { background: #fff; }

  .dmg {
    position: relative;
    width: 660px;
    height: 340px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    /* Paper, not a light grey box: warm-neutral, brightest at the top. */
    background:
      radial-gradient(760px 380px at 50% -34%, #ffffff 0%, rgba(255, 255, 255, 0) 70%),
      linear-gradient(180deg, #f7f8fa 0%, #eef0f4 100%);
  }

  .mark {
    position: absolute;
    top: 46px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Playfair Display', Georgia, "Times New Roman", serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: #14181f;
  }

  .sub {
    position: absolute;
    top: 88px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12.5px;
    letter-spacing: 0.1px;
    color: #78818f;
  }

  /* One thin arrow, sized to the gap between the icons. Three stacked chevrons
     read as decoration; a single stroke reads as an instruction. */
  .arrow {
    position: absolute;
    top: 175px;
    left: 268px;
    width: 124px;
    height: 1.5px;
    margin-top: -1px;
    background: linear-gradient(to right, rgba(120, 129, 143, 0) 0%, #9aa2ae 24%, #78818f 100%);
  }
  .arrow::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    width: 9px;
    height: 9px;
    margin: -5px -1px 0 0;
    border-right: 1.5px solid #78818f;
    border-top: 1.5px solid #78818f;
    transform: rotate(45deg);
  }
</style>

<div class="dmg">
  <div class="mark">Third Street Bookmarks</div>
  <div class="sub">Drag the app into your Applications folder</div>
  <div class="arrow"></div>
</div>
